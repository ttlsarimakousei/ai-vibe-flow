<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内网体检演示站 - 登录</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>内网体检演示站</h1>
    <p class="hint">演示账号 admin，密码 admin123</p>
    <form id="loginForm" autocomplete="off">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" placeholder="请输入用户名">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码">
      <button type="submit" class="btn btn-primary">登录</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
  </div>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    var body = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    };
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 200 && res.body.ok) {
        location.href = '/dashboard.html' + location.search + '#home';
      } else {
        msg.textContent = res.body.msg || '登录失败';
      }
    }).catch(function () {
      msg.textContent = '网络错误，请稍后重试';
    });
  });
})();
</script>
</body>
</html>
